# Full training config logged for the task-order-2 run of this experiment
# (original run name: LiberoTrainPi05_RandER_01_order2). Reproduce with:
#   bash experiments/train_rander_1pct.sh 2
# Orders 0 and 1 differ only in exp_name and task_order_index.
anchor_action_ood_mode: top_percent
anchor_baseline_max_samples_per_task: null
anchor_chunk_size: 512
anchor_consolidation: median
anchor_flow_noise_level: 0.2
anchor_invert_remove_proportion: 0.05
anchor_invert_selection: false
anchor_max_embedding_samples_per_task: null
anchor_n_neighbors: 5
anchor_num_flow_steps: 10
anchor_ood_top_percent: 25
anchor_random_proportion: 0.6
anchor_repr_mode: prefix_embed
anchor_rot_metric: geodesic
anchor_rot_weight: 0.1
anchor_std_cutoff: 2
assets_base_dir: ./assets
batch_size: 32
checkpoint_base_dir: ./checkpoints
cl: er
data:
  assets:
    asset_id: null
    assets_dir: ./assets/pi05_libero-libero_goal_sequential
  base_config:
