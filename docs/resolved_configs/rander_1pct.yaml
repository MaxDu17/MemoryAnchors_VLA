    - actions
    action_space: null
    asset_id: null
    data_transforms:
      inputs: []
      outputs: []
    datasets: []
    model_transforms:
      inputs: []
      outputs: []
    norm_stats: null
    prompt_from_task: true
    repack_transforms:
      inputs: []
      outputs: []
    repo_id: null
    rlds_data_dir: null
    use_quantile_norm: false
  extra_delta_transform: false
  repo_id: physical-intelligence/libero_bytask/libero-libero_goal_no_noops
  repo_ids:
  - physical-intelligence/libero_bytask/libero-libero_goal_no_noops/open_the_middle_drawer_of_the_cabinet
  - physical-intelligence/libero_bytask/libero-libero_goal_no_noops/put_the_bowl_on_the_stove
  - physical-intelligence/libero_bytask/libero-libero_goal_no_noops/put_the_wine_bottle_on_top_of_the_cabinet
  - physical-intelligence/libero_bytask/libero-libero_goal_no_noops/open_the_top_drawer_and_put_the_bowl_inside
