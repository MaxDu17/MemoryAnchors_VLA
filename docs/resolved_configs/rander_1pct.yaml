pytorch_training_precision: bfloat16
pytorch_weight_path: null
resume: true
save_end_of_task_only: true
save_interval: 1000
seed: 42
steps_per_task: 5000
task_order_index: 2
task_order_permutation: null
wandb_enabled: true
weight_loader:
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
