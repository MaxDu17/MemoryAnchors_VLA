debug: false
debug_batch_size: 8
debug_steps_per_task: 5
double_batch_start: false
ema_decay: 0.999
exp_name: LiberoTrainPi05_RandER_01_order2
freeze_filter: Nothing()
fsdp_devices: 1
keep_period: 5000
learn_one_task_idx: -1
log_interval: 100
lr_schedule:
  decay_lr: 5e-05
  decay_steps: 1000000
  peak_lr: 5e-05
  warmup_steps: 10000
max_to_keep: null
model:
  action_dim: 32
  action_expert_variant: gemma_300m
  action_horizon: 10
  discrete_state_input: false
  dtype: bfloat16
  max_token_len: 200
  paligemma_variant: gemma_2b
  pi05: true
